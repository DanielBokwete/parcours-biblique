/* ===================== MOTEUR DE QUESTIONS =====================
   mode "level" : cœurs, chrono 20 s, aides ; on réessaie jusqu'à trouver (la bonne réponse n'est jamais montrée).
   mode "test"  : méditation et mémorisation ; une seule tentative, sans cœur ni chrono, correction affichée. */
let LS=null,TM=null;
function normQ(q){if(q.t==="tf")return {type:"choice",disp:"tf",q:q.q,o:["Vrai","Faux"],a:[q.a?0:1],ref:q.ref,ex:q.ex};
  if(q.t==="fill")return {type:"fill",q:q.q,s:q.s,o:q.o,a:[q.a],ref:q.ref,ex:q.ex};
  if(q.t==="match")return {type:"match",q:q.q,pairs:q.pairs,right:shuffle(q.pairs.map(p=>p[1])),ref:q.ref,ex:q.ex};
  return {type:"choice",disp:"qcm",q:q.q,o:q.o,a:q.a,ref:q.ref,ex:q.ex,ill:q.ill};}
/* ---------- Questions qui varient quand on rejoue un niveau ----------
   1re partie : les 5 questions du niveau. Ensuite, on garde 3 questions du niveau (jamais les mêmes 3)
   et on ajoute 2 questions prises dans les mêmes chapitres : banque en ligne (ajouts des admins, vidéos…)
   ou, sans connexion, questions tirées du texte biblique du passage. Ordre et réponses mélangés. */
function levelChapters(b,lv){const s=String(lv.ref||"").slice(b.name.length).trim(),out=[];
  s.split(";").forEach(seg=>{seg=seg.trim();let m;
    if((m=/^(\d+)\s*[–-]\s*(\d+)$/.exec(seg)))for(let c=+m[1];c<=+m[2];c++)out.push({c});
    else if((m=/^(\d+):(\d+)-(\d+)$/.exec(seg)))out.push({c:+m[1],v1:+m[2],v2:+m[3]});
    else if((m=/^(\d+)/.exec(seg)))out.push({c:+m[1]});});
  return out;}
function shuffleOpts(q){if(q.type!=="choice"||q.disp!=="qcm"||!Array.isArray(q.o))return q;const idx=shuffle(q.o.map((_,i)=>i));
  return Object.assign({},q,{o:idx.map(i=>q.o[i]),a:(q.a||[]).map(x=>idx.indexOf(x))});}
function bankToQ(r){if(r.kind==="tf")return {type:"choice",disp:"tf",q:r.prompt,o:["Vrai","Faux"],a:[r.answer?0:1],ref:r.ref,ex:r.explanation||""};
  if(r.kind==="fill")return {type:"fill",q:r.prompt||"Complète le verset",s:r.sentence,o:r.options,a:[r.answer],ref:r.ref,ex:r.explanation||""};
  return {type:"choice",disp:"qcm",q:r.prompt,o:r.options,a:Array.isArray(r.answer)?r.answer:[r.answer],ref:r.ref,ex:r.explanation||""};}
function passageQs(b,chs){if(!BIBLE||!chs.length)return [];const out=[];let guard=0;
  while(out.length<3&&guard++<12){const seg=pick(chs),ch=BIBLE[b.g]&&BIBLE[b.g][seg.c-1];if(!ch)continue;
    const v1=seg.v1||1,v2=Math.min(seg.v2||ch.length,ch.length),v=v1+Math.floor(Math.random()*(v2-v1+1)),t=ch[v-1]||"";if(t.length<40||t.length>240)continue;
    const r=genVerseQuestions({g:b.g,c:seg.c,v},false).qs.filter(q=>q.type==="fill"||q.tag==="Contexte");if(r.length)out.push(pick(r));}
  return out;}
async function levelQuestions(b,L,lv){const base=lv.qs.map(normQ),key=b.id+"-"+L;S.lvPlays=S.lvPlays||{};const plays=S.lvPlays[key]||0;
  if(plays===0&&L>doneOf(b))return base.map(shuffleOpts);
  const chs=levelChapters(b,lv),n=base.length,keepN=Math.min(3,n),start=(plays*2)%n;
  const keep=Array.from({length:keepN},(_,i)=>base[(start+i)%n]);
  let extra=[];
  try{if(typeof olLevelPool==="function"){const rows=await Promise.race([olLevelPool(b.name,chs.map(x=>x.c)),new Promise(r=>setTimeout(()=>r([]),1500))]);
    const mine=new Set(lv.qs.map(q=>q.q));extra=shuffle((rows||[]).filter(r=>!String(r.source||"").startsWith(key+"-")&&!mine.has(r.prompt))).map(bankToQ);}}catch(e){}
  if(extra.length<n-keepN){try{await Promise.race([loadBible(),new Promise((_,j)=>setTimeout(j,1500))]);}catch(e){}extra=extra.concat(passageQs(b,chs));}
  const qs=keep.concat(extra.slice(0,n-keepN));while(qs.length<n)qs.push(base[(start+qs.length)%n]);
  return shuffle(qs).map(shuffleOpts);}
let lvStarting=false;
async function startLevel(b,L,fromReview){if(lvStarting)return;regen();helpsReset();if(!S.testament)S.testament=b.t;if(S.hearts<=0&&!unlimited()){noHearts();return;}
  lvStarting=true;let qs;const lv=CONTENT[b.id].levels[L];try{qs=await levelQuestions(b,L,lv);}catch(e){qs=lv.qs.map(normQ);}finally{lvStarting=false;}const steps=[];const pk=b.id+"-"+L;S.lvPlays=S.lvPlays||{};S.lvPlays[pk]=(S.lvPlays[pk]||0)+1;save();
  lv.cards.forEach((c,i)=>steps.push({k:"card",c,i,n:lv.cards.length,label:"L'essentiel",last:i===lv.cards.length-1,go:"Aux questions !"}));
  qs.forEach((q,i)=>{steps.push({k:"q",q});if(i===1&&lv.mid)lv.mid.forEach((c,j)=>steps.push({k:"card",c,i:j,n:lv.mid.length,label:"Pour aller plus loin",last:j===lv.mid.length-1,go:"Reprendre les questions",num0:lv.cards.length}));});
  LS={mode:"level",fromReview:!!fromReview,b,L,lv,title:levelTitle(b,L),ref:lv.ref,steps,si:0,total:qs.length,qdone:0,xp:0,combo:0,best:0,mistakes:0,firstTry:0};

  if(cand){const re=wre(cand.w),hits=[];for(let gi=0;gi<66&&hits.length<40;gi++)BIBLE[gi].forEach((chp,ci)=>chp.forEach((tx,vi)=>{if(hits.length<40&&!(gi===g&&ci===c-1)&&re.test(tx))hits.push({g:gi,c:ci+1,v:vi+1,t:tx});}));
    if(hits.length){const other=hits.find(h=>h.g!==g)||hits[0],dis=[];let gd2=0;while(dis.length<3&&gd2++<200){const rv=randomVerse();if(!hasWord(rv.t,cand.w)&&rv.t.length>40&&rv.t.length<220)dis.push(rv);}
      const fmtV=x=>`${cut(norm(x.t),110)} (${vref(x.g,x.c,x.v)})`;
      qs.push({type:"choice",disp:"qcm",tag:"Renvoi",tagc:"warm",q:`Le mot « ${cand.w} » apparaît ${cand.n>1?plural(cand.n,"fois"):"aussi"} dans la Bible. Lequel de ces versets l'emploie aussi ?`,o:shuffle([fmtV(other),...dis.map(fmtV)]),ans:fmtV(other),ill:"🔗",ref:vref(other.g,other.c,other.v),ex:`Va le lire en entier : rapprocher deux versets qui se répondent enrichit la méditation.`});}}
  // 8. deuxième mot manquant
  if(full&&kw[1]&&kw[1]!==kw[0])qs.push({type:"fill",tag:"Mémoire",q:"Encore un mot à retrouver",s:blankWord(t,kw[1]),o:shuffle([kw[1],...distractWords(kw[1],t,3)]),ans:kw[1],ref:r,ex:""});
  qs.forEach(q=>{if(q.ans!==undefined)q.a=[q.o.indexOf(q.ans)];});
  return {qs,last:{type:"recite",tag:"Récitation",q:"Récite ce verset de mémoire",answer:norm(t),ref:r,ex:"Un verset appris par cœur t'accompagne toute la journée."}};}
function genReflection(){return [
  {type:"choice",disp:"qcm",graded:false,tag:"Réflexion",q:"Pour toi aujourd'hui, ce passage est surtout…",o:["Une promesse à recevoir","Un appel ou un ordre à suivre","Une vérité sur qui est Dieu","Un exemple à suivre ou à éviter"],a:[0],ill:"🪞",ex:"Il n'y a pas de mauvaise réponse. Écris dans ton carnet pourquoi tu as fait ce choix."},
  {type:"choice",disp:"qcm",graded:false,tag:"Réflexion",q:"Quelle action concrète vas-tu poser aujourd'hui ?",o:["Prier pour quelqu'un en particulier","Pardonner ou demander pardon","Partager ce verset avec un proche","Changer une habitude"],a:[0],ill:"🎯",ex:"Une méditation porte du fruit quand elle devient un geste."}];}

/* ===================== PLAN DE MÉDITATION ANNUEL =====================
   Même calendrier pour tout le monde : les chapitres de l'année sont répartis jour par jour, avec une orientation par livre et une question du jour. */
let PLAN_CACHE={},calMonth=null,planSel=null;
function planFor(year){if(PLAN_CACHE[year])return PLAN_CACHE[year];const P=YEAR_PLANS[year]||YEAR_PLANS[year%2===0?2026:2027];const chs=[];
  P.books.forEach(k=>{const list=k==="AT"||k==="NT"?BOOKS[k]:ALLB.filter(b=>b.id===k);list.forEach(b=>{for(let c=1;c<=b.ch;c++)chs.push({g:b.g,c});});});
  const days=Math.round((new Date(year,11,31)-new Date(year,0,1))/864e5)+1,out=[];
  for(let d=0;d<days;d++){const a=Math.floor(d*chs.length/days),z=Math.floor((d+1)*chs.length/days);out.push(chs.slice(a,Math.max(z,a+1)));}
  return PLAN_CACHE[year]={meta:P,days:out};}
const dayIndex=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,1))/864e5);
function passageLabel(list){const groups=[];list.forEach(x=>{const l=groups[groups.length-1];if(l&&l.g===x.g&&l.z===x.c-1)l.z=x.c;else groups.push({g:x.g,a:x.c,z:x.c});});
  return groups.map(x=>`${ALLB[x.g].name} ${x.a}${x.z!==x.a?"–"+x.z:""}`).join(" · ");}
function orientFor(g){const b=ALLB[g];if(ORIENT[b.id])return ORIENT[b.id];if(b.t==="NT"){if(b.idx<=3)return ORIENT._gosp;if(b.idx===4)return ORIENT._act;if(b.idx<=17)return ORIENT._paul;if(b.idx<=25)return ORIENT._gen;return ORIENT._apo;}return "";}

  p.innerHTML=`${tabs}
   <div class="planhero"><div class="eyebrow" style="color:#ffe1b0">Plan de méditation ${Y} · le même pour toute la communauté</div><h2 style="font-size:24px">${esc(plan.meta.title)}</h2><p>${esc(plan.meta.sub)}. Un passage par jour, avec une orientation pour mieux méditer.</p>
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span>${doneN} / ${plan.days.length} jours médités</span><span>${Math.round(doneN/plan.days.length*100)}%</span></div><span class="bar"><i style="width:${doneN/plan.days.length*100}%"></i></span></div>

    <textarea class="journal" id="pNote" placeholder="Ce que je retiens aujourd'hui…" aria-label="Ce que je retiens">${esc(S.plan.notes[key(planSel)]||"")}</textarea>
    <div class="actions"><button class="btn" id="pRead">📖 Lire le passage</button><button class="btn ${S.plan.done[key(planSel)]?"good":"ghost"} helpbtn" id="pDone">${S.plan.done[key(planSel)]?"✓ Médité":"Fait"}</button></div></div>
   <div class="card"><div class="calnav"><button id="cPrev" aria-label="Mois précédent" ${calMonth>0?"":"disabled"}>‹</button><b>${new Date(Y,calMonth,1).toLocaleDateString("fr-FR",{month:"long"})}</b><button id="cNext" aria-label="Mois suivant" ${calMonth<11?"":"disabled"}>›</button></div>

      return `<button data-day="${d}" class="${S.plan.done[key(d)]?"done":""} ${d===today?"today":""} ${d===planSel?"sel":""} ${d>today?"future":""}">${i+1}</button>`;}).join("")}</div></div>

/* Photo de profil : recadrée en carré 256 px. Envoyée dans le compte (Supabase) si connecté, sinon gardée sur l'appareil. */
function squareImage(file,size){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement("canvas");c.width=c.height=size;
  c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(u);c.toBlob(b=>b?res({blob:b,data:c.toDataURL("image/jpeg",.8)}):rej(new Error("image")),"image/jpeg",.85);};img.onerror=rej;img.src=u;});}
async function setPhoto(file){const sq=await squareImage(file,256);if(typeof olUploadPhoto==="function"){const url=await olUploadPhoto(sq.blob);if(url)return url;}return (await squareImage(file,96)).data;}

/* ---------- Installer l'application (Android : installation directe ; iPhone : explication) ---------- */
let installEvt=null;
const isStandalone=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true||document.referrer.startsWith("android-app://");}catch(e){return false;}};
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)&&!window.MSStream;
const canInstall=()=>!!document.querySelector("link[rel=manifest]")&&!isStandalone()&&(!!installEvt||isIOS());
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;refreshInstall();});
addEventListener("appinstalled",()=>{installEvt=null;S.installed=true;save();refreshInstall();notify("📲","Application installée","Retrouve Parcours Biblique sur ton écran d'accueil.");});
function installCard(){if(!canInstall())return "";
  return `<div class="card installcard"><span class="ic-app"><img src="/icons/icon-192.png" alt=""></span><div style="flex:1;min-width:0"><b>Installer l'application</b><small>Plein écran, icône sur ton téléphone, ouverture plus rapide.</small></div><button class="btn small" data-install style="width:auto">Installer</button></div>`;}
async function doInstall(){sfx("tap");
  if(installEvt){const e=installEvt;installEvt=null;try{await e.prompt();const r=await e.userChoice;if(r&&r.outcome!=="accepted")installEvt=e;}catch(err){}refreshInstall();return;}
  if(isIOS())openSheet(`<h3 style="margin:0 0 8px">📲 Installer sur iPhone</h3><ol style="line-height:1.8;padding-left:20px;margin:0 0 14px"><li>Touche le bouton <b>Partager</b> <span style="font-size:18px">⎋</span> en bas de Safari.</li><li>Choisis <b>« Sur l'écran d'accueil »</b>.</li><li>Touche <b>Ajouter</b> : l'icône Parcours Biblique apparaît.</li></ol><button class="btn" onclick="closeSheet()">Compris</button>`);}
function bindInstall(root){(root||document).querySelectorAll("[data-install]").forEach(b=>b.onclick=doInstall);}
function refreshInstall(){const ban=$("installBan");if(ban){ban.hidden=!(canInstall()&&!S.installHide&&curScreen==="path");}
  if(curScreen==="profile")try{const y=$("profilePage").scrollTop;renderProfile();$("profilePage").scrollTop=y;}catch(e){}}
(function(){const d=document.createElement("div");d.id="installBan";d.className="installban";d.hidden=true;
  d.innerHTML=`<img src="/icons/icon-192.png" alt=""><div><b>Installe Parcours Biblique</b><small>En plein écran, comme une vraie application</small></div><button class="btn small" data-install style="width:auto">Installer</button><button class="ibx" aria-label="Fermer">✕</button>`;
  document.getElementById("app").appendChild(d);bindInstall(d);d.querySelector(".ibx").onclick=()=>{S.installHide=true;save();d.hidden=true;};
  setInterval(refreshInstall,1500);})();

/* ---------- Mises à jour ----------
   • Le jeu lui-même (questions, écrans…) vient du site : on vérifie au démarrage, au retour sur l'appli et toutes
     les 30 min si une version plus récente est en ligne, et on propose de recharger.
   • L'application Android installée hors Play Store (APK) est créée avec l'adresse de départ « /?app=apk&v=N ».
     Si une APK plus récente existe, on propose de la télécharger ; Android lance ensuite l'installation.
     La version Play Store ne reçoit jamais ce message : c'est Google Play qui la met à jour. */
const APK_INFO=(()=>{try{const u=new URLSearchParams(location.search);if(u.get("app")==="apk"){const v=+u.get("v")||1;localStorage.setItem("pb-apk-v",String(v));return {v};}
  const s=+localStorage.getItem("pb-apk-v");return s&&isStandalone()?{v:s}:null;}catch(e){return null;}})();
let updShown={web:false,apk:false};
async function checkUpdates(){if(!window.PB_BUILD||!navigator.onLine)return;let v;
  try{v=await (await fetch("/version.json?t="+Date.now(),{cache:"no-store"})).json();}catch(e){return;}
  if(APK_INFO&&v.apk&&v.apk.version>APK_INFO.v&&!updShown.apk&&!S.apkSkip?.[v.apk.version]){updShown.apk=true;showApkUpdate(v.apk);return;}
  if(v.web&&v.web!==window.PB_BUILD&&!updShown.web){updShown.web=true;showWebUpdate();}}
function showWebUpdate(){if(curScreen==="lesson"||curScreen==="duel"){updShown.web=false;return;}
  notify("✨","Nouvelle version disponible","Touche ici pour mettre à jour le jeu.",()=>location.reload());}
function showApkUpdate(a){const force=APK_INFO.v<(a.minVersion||0);
  openSheet(`<div class="center" style="gap:10px;padding:6px 0"><img src="/icons/icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px">
    <h3 style="margin:0">Mise à jour de l'application</h3><p class="muted" style="margin:0">Version ${esc(a.versionName||String(a.version))} disponible${a.notes?` : ${esc(a.notes)}`:"."}</p>
    <ol style="text-align:left;line-height:1.7;padding-left:20px;margin:6px 0;font-size:14.5px"><li>Touche <b>Télécharger</b>.</li><li>Ouvre le fichier téléchargé.</li><li>Si Android le demande, autorise l'installation, puis touche <b>Mettre à jour</b>.</li></ol>
    <div style="display:grid;gap:10px;width:100%"><a class="btn" id="apkGo" href="${esc(a.url)}" download>⬇️ Télécharger la mise à jour</a>${force?"":`<button class="btn ghost" id="apkLater">Plus tard</button>`}</div></div>`);
  const l=$("apkLater");if(l)l.onclick=()=>{S.apkSkip=Object.assign(S.apkSkip||{},{[a.version]:Date.now()});save();closeSheet();};
  $("apkGo").onclick=()=>{sfx("tap");setTimeout(()=>notify("⬇️","Téléchargement lancé","Ouvre le fichier dans tes notifications pour installer."),400);};}
setTimeout(checkUpdates,4000);setInterval(checkUpdates,30*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdates();});

function olCountryList(){if(olCountries)return olCountries;let dn=null;try{dn=new Intl.DisplayNames(["fr"],{type:"region"});}catch(e){}

function olPicker(anchor,items,cur,onPick,opts){document.querySelectorAll(".pkpanel").forEach(x=>x.remove());

  p.innerHTML=`<input class="pksearch" placeholder="${opts.ph}" autocomplete="off" inputmode="search"><div class="pklist"></div>`;
  anchor.after(p);const inp=p.querySelector("input"),list=p.querySelector(".pklist");
  const draw=()=>{const q=olNorm(inp.value).replace(/^\+/,"");
    const f=items.filter(c=>!q||olNorm(c.name).includes(q)||c.iso.toLowerCase()===q||(c.dial&&c.dial.startsWith(q))||c.iso==="autre");
    list.innerHTML=f.slice(0,300).map(c=>`<button type="button" data-v="${c.iso}" aria-pressed="${c.iso===cur}"><span class="pkf">${c.flag||"✏️"}</span><span class="pkn">${esc(c.name)}</span>${opts.dial&&c.dial?`<b>+${c.dial}</b>`:""}</button>`).join("")||`<p class="muted" style="padding:10px;margin:0">Aucun pays trouvé</p>`;
    list.querySelectorAll("button").forEach(b=>b.onclick=()=>{p.remove();onPick(b.dataset.v);});};
  inp.oninput=draw;draw();setTimeout(()=>{inp.focus();const s=list.querySelector('[aria-pressed="true"]');if(s&&!inp.value)s.scrollIntoView({block:"center"});},30);
  const close=e=>{if(!p.contains(e.target)&&e.target!==anchor&&!anchor.contains(e.target)){p.remove();document.removeEventListener("pointerdown",close,true);}};
  setTimeout(()=>document.addEventListener("pointerdown",close,true),0);}

  if(!sess&&fromGoogle){const r=await olWithin(sb.auth.getSession(),8000,{data:{session:null}});sess=r.data.session;}
  OL.session=sess||OL.session;sess=OL.session;OL.booted=true;
  if(sess){let back=null;try{back=localStorage.getItem("pb-after-login");if(back)localStorage.removeItem("pb-after-login");}catch(e){}

async function olUploadPhoto(blob){if(!OL.sb||!OL.session)return null;const uid=OL.session.user.id,path=`${uid}/photo-${Date.now()}.jpg`;
  const {error}=await OL.sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg",upsert:true});if(error)throw error;

/* ===================== ANNONCES =====================
   Annonces publiées par l'équipe depuis l'admin (événements, partenaires…).
   - bandeau discret en haut de l'écran, à intervalle réglable, jamais pendant une question ;
   - annonces à regarder volontairement pour gagner une vie ou une aide (contrôlé par le serveur) ;
   - chaque annonce peut viser une ou plusieurs villes ; le serveur fait tourner les annonces à parts égales.
   Tous les réglages (fréquence, durées, gains, plafond du jour, vies pour jouer en ligne) viennent de la base. */
const AD={set:null,setAt:0,banT:null,busy:false,tick:null};
const AD_DEF={banner_every_min:10,banner_seconds:8,reward_seconds:8,reward_lives:1,reward_helps:1,reward_daily_max:10,online_min_lives:3,online_cost_lives:1};
const adCfg=()=>Object.assign({},AD_DEF,AD.set||{});
const adSb=()=>typeof olInit==="function"?olInit():null;
function adViewer(){let v="";try{v=localStorage.getItem("pb-viewer")||"";if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem("pb-viewer",v);}}catch(e){v=v||"invite";}return v;}
async function adLoadSettings(force){const sb=adSb();if(!sb)return adCfg();if(!force&&AD.set&&Date.now()-AD.setAt<10*60000)return adCfg();
  try{const {data}=await sb.from("ad_settings").select("*").eq("id",1).maybeSingle();if(data){AD.set=data;AD.setAt=Date.now();}}catch(e){}return adCfg();}

/* ---------- Ville du joueur : estimée par la connexion, remplaçable dans le profil ---------- */
function adCountryName(c){if(!c)return "";if(/^[A-Z]{2}$/.test(c)){try{return new Intl.DisplayNames(["fr"],{type:"region"}).of(c)||c;}catch(e){}}return c;}
const adCityLabel=()=>S.loc&&S.loc.city?S.loc.city+(S.loc.country?", "+adCountryName(S.loc.country):""):"";
async function adLocate(force){const L=S.loc||{};if(!force&&L.src==="manual"&&L.city)return;if(!force&&L.city&&Date.now()-(L.at||0)<12*3600e3)return;
  try{const r=await fetch("/api/geo",{cache:"no-store"});if(!r.ok)return;const g=await r.json();
    if(g&&g.city){S.loc={city:g.city,country:g.country||"",src:"auto",at:Date.now()};save();}}catch(e){}}
// Après connexion : la ville choisie dans le profil (sur n'importe quel appareil) l'emporte.
function adFromProfile(){if(!OL.me)return;
  if(OL.me.city){if(S.loc.src!=="manual"||S.loc.city!==OL.me.city){S.loc={city:OL.me.city,country:OL.me.country||"",src:"manual",at:Date.now()};save();}}
  else if(S.loc.src==="manual"&&S.loc.city){olRpc("set_my_city",{p_city:S.loc.city,p_country:S.loc.country||""}).catch(()=>{});}}
function adCityCard(){const L=S.loc||{};
  return `<div class="card row"><span class="ic" style="background:#e7eefc">📍</span><div style="flex:1;min-width:0"><b>Ma ville</b><br><small>${L.city?esc(adCityLabel())+(L.src==="manual"?"":" · détectée automatiquement"):"Pas encore détectée"}</small><br><small class="muted">Pour voir les événements près de chez toi.</small></div><button class="chip" id="cityEdit">Modifier</button></div>`;}
function bindCityCard(){const b=$("cityEdit");if(!b)return;b.onclick=()=>{sfx("tap");const L=S.loc||{};
  openSheet(`<h2 style="font-size:23px;margin:0 0 6px">Ma ville</h2><p class="muted" style="margin:0 0 14px;line-height:1.45">Les annonces d'événements (concerts, conférences, cultes…) sont choisies selon ta ville.</p>
   <div style="display:grid;gap:12px"><div class="field"><label for="cIn">Ville</label><input id="cIn" value="${esc(L.city||"")}" placeholder="Ex. Kinshasa" maxlength="60" autocomplete="address-level2"></div>
   <div class="field"><label for="kIn">Pays</label><input id="kIn" value="${esc(adCountryName(L.country))}" placeholder="Ex. RD Congo" maxlength="60" autocomplete="country-name"></div>
   <button class="btn" id="cOk">Enregistrer</button>${L.src==="manual"?`<button class="btn ghost" id="cAuto">Détecter automatiquement</button>`:""}</div>`);
  $("cOk").onclick=()=>{const city=$("cIn").value.trim().replace(/\s+/g," "),ct=$("kIn").value.trim();if(!city){$("cIn").focus();return;}
    S.loc={city,country:ct,src:"manual",at:Date.now()};save();if(OL.session)olRpc("set_my_city",{p_city:city,p_country:ct}).catch(()=>{});
    closeSheet();notify("📍","Ville enregistrée",city);if(curScreen==="profile")renderProfile();};
  const a=$("cAuto");if(a)a.onclick=async()=>{a.disabled=true;a.textContent="Détection…";S.loc={city:"",country:"",src:"",at:0};save();
    if(OL.session)olRpc("set_my_city",{p_city:"",p_country:""}).catch(()=>{});await adLocate(true);closeSheet();if(curScreen==="profile")renderProfile();};};}

/* ---------- Statistiques (vues, clics) ---------- */
function adLog(ad,kind,mode){const sb=adSb();if(!sb||!ad)return Promise.resolve();
  return sb.rpc("ad_log",{p_ad:ad.id,p_kind:kind,p_mode:mode,p_viewer:adViewer(),p_city:(S.loc&&S.loc.city)||""}).then(()=>{},()=>{});}
// Ouvre le lien dans un nouvel onglet / le navigateur, sans jamais quitter le jeu.
function adOpen(ad,mode){if(!ad||!ad.link_url)return;adLog(ad,"click",mode);const a=document.createElement("a");a.href=ad.link_url;a.target="_blank";a.rel="noopener noreferrer";document.body.appendChild(a);a.click();a.remove();}
async function adNext(mode){const sb=adSb();if(!sb)return null;try{const {data,error}=await sb.rpc("next_ad",{p_mode:mode,p_city:(S.loc&&S.loc.city)||"",p_viewer:adViewer()});if(error)return null;return data||null;}catch(e){return null;}}

/* ---------- Bandeau en haut de l'écran ---------- */
function adTick(){if(!S.onboarded||document.visibilityState!=="visible")return;S.activeSec++;if(S.activeSec%10===0)saveLocal();
  const c=adCfg();if(!(c.banner_every_min>0))return;
  const calm=TABS.includes(curScreen)&&$("veil").hidden&&$("reminder").hidden&&$("adBan").hidden&&$("toast").hidden;
  if(calm&&S.activeSec-(S.adAt||0)>=c.banner_every_min*60){S.adAt=S.activeSec;saveLocal();adBanner();}}
async function adBanner(){if(AD.busy)return;AD.busy=true;
  try{const c=await adLoadSettings();const ad=await adNext("banner");if(!ad)return;
    const b=$("adBan");
    b.innerHTML=`${ad.image_url?`<img src="${esc(ad.image_url)}" alt="">`:`<span class="adic">📣</span>`}<span class="adtx"><small>Annonce</small><b>${esc(ad.title)}</b>${ad.body?`<span>${esc(ad.body)}</span>`:""}</span>${ad.link_url?`<span class="adcta">${esc(ad.cta||"Voir")}</span>`:""}<button class="adx" aria-label="Fermer l'annonce">✕</button>`;
    b.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add("on")));adLog(ad,"view","banner");
    b.onclick=e=>{if(e.target.closest(".adx")){adHideBan();return;}if(ad.link_url){adOpen(ad,"banner");adHideBan();}};
    let y0=null;b.ontouchstart=e=>{y0=e.touches[0].clientY;};b.ontouchmove=e=>{if(y0!==null&&e.touches[0].clientY-y0<-24){y0=null;adHideBan();}};
    clearTimeout(AD.banT);AD.banT=setTimeout(adHideBan,Math.max(4,+c.banner_seconds||8)*1000);
  }catch(e){}finally{AD.busy=false;}}
function adHideBan(){const b=$("adBan");if(!b||b.hidden)return;b.classList.remove("on");clearTimeout(AD.banT);setTimeout(()=>{if(!b.classList.contains("on"))b.hidden=true;},380);}

/* ---------- Musique d'annonce : seulement pendant une annonce que le joueur a choisi de regarder ---------- */
const AD_SILENT="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjU0AAAAAAAAAAAAAAAAJAAAAAAAAAAAAYYoRBqpAAAAAAD/+xDEAAPAAAGkAAAAIAAANIAAAARMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";
function adAudioUnlock(){try{if(!AD.au){AD.au=new Audio();AD.au.preload="auto";}const a=AD.au;a.src=AD_SILENT;a.volume=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
const adSoundOn=()=>!!(S.set.music||S.set.sfx);
function adAudioPlay(url){const a=AD.au;if(!a||!url||!adSoundOn())return false;try{AD.musicWas=!!S.set.music;if(typeof stopMusic==="function")stopMusic();
  a.pause();a.src=url;a.loop=true;a.volume=0.85;a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{const b=$("adSnd");if(b)b.textContent="🔇 Son coupé · toucher pour écouter";});return true;}catch(e){return false;}}
function adAudioStop(){const a=AD.au;if(a){try{a.pause();a.removeAttribute("src");a.load();}catch(e){}}if(AD.musicWas&&S.set.music&&typeof startMusic==="function")startMusic();AD.musicWas=false;}

/* ---------- Annonce à regarder pour gagner une vie ou une aide (plein écran) ----------
   Vidéo ou image en plein écran, minuteur et barre de progression ; la récompense est accordée
   automatiquement à la fin de la durée, ou dès que le joueur touche le lien de l'annonce. */
async function adReward(kind,after){sfx("tap");adAudioUnlock();const c=await adLoadSettings();const life=kind==="life";
  const gain=life?(+c.reward_lives||0):(+c.reward_helps||0);
  if(life&&unlimited()){notify("♥","Vies illimitées","Tu as déjà des vies illimitées en ce moment.");return;}
  if(life){regen();if(S.hearts>=MAX_HEARTS){notify("♥","Tes vies sont au complet","Reviens quand il t'en manquera.");return;}}
  const prize=life?`+${gain} ♥`:`+${gain} 💡 aide${gain>1?"s":""}`;
  const sorry=(t,p)=>{openSheet(`<div class="center" style="padding-top:4px"><div class="medal big">${life?"💔":"💡"}</div><h2 style="font-size:24px">${t}</h2><p style="line-height:1.5">${p}</p></div><div style="display:grid;gap:10px">${life?`<button class="btn" id="adInv">📤 Inviter un ami · 24 h de vies illimitées</button>`:""}<button class="btn ghost" id="adBack">Fermer</button></div>`);
    $("adBack").onclick=closeSheet;const iv=$("adInv");if(iv)iv.onclick=()=>{closeSheet();if(typeof olShareInvite==="function")olShareInvite();};};
  const later=life?`Un cœur revient toutes les 25 minutes.`:`Tes aides reviennent à minuit.`;
  if(!gain){sorry("Pas d'annonce pour le moment",later);return;}
  const sb=adSb();if(!sb){sorry("Connexion nécessaire","Les annonces s'affichent quand tu es connecté à internet. "+later);return;}
  openSheet(`<div class="center" style="padding:18px 0"><div class="radar"><span>📣</span></div><p>Recherche d'une annonce…</p></div>`);
  let left=1;try{const {data}=await sb.rpc("ad_rewards_left",{p_viewer:adViewer()});if(typeof data==="number")left=data;}catch(e){}
  if(left<=0){sorry("C'est tout pour aujourd'hui","Tu as regardé toutes les annonces récompensées du jour. "+later);return;}
  const ad=await adNext("reward");
  if(!ad){sorry("Pas d'annonce pour le moment","Aucune annonce n'est disponible dans ta ville pour l'instant. "+later);return;}
  closeSheet();adPlayer(ad,{life,prize,later,sorry,after});}

function adPlayer(ad,o){const sb=adSb();const c=adCfg();const app=$("app")||document.body;
  const old=$("adFull");if(old)old.remove();
  const vid=!!ad.video_url;const base=Math.min(120,Math.max(3,+ad.duration_s||+c.reward_seconds||8));
  const el=document.createElement("div");el.id="adFull";el.className="adfull";el.setAttribute("role","dialog");el.setAttribute("aria-label","Annonce");
  const bg=ad.image_url?`<div class="adf-bg" style="background-image:url('${esc(ad.image_url)}')"></div>`:"";
  el.innerHTML=`${bg}<div class="adf-media">${vid?`<video id="adfV" src="${esc(ad.video_url)}" ${ad.image_url?`poster="${esc(ad.image_url)}"`:""} playsinline webkit-playsinline preload="auto"></video>`:ad.image_url?`<img src="${esc(ad.image_url)}" alt="">`:`<div class="adf-txt">${esc(ad.title)}</div>`}</div>
    <div class="adf-top"><div class="adf-l"><span class="adf-tag">Annonce</span>${vid||ad.audio_url?`<button class="adf-ic" id="adfSnd" aria-label="Son">🔇</button>`:""}</div>
      <div class="adf-r"><span class="adf-pill" id="adfPill"><svg viewBox="0 0 36 36" class="adf-ring"><circle cx="18" cy="18" r="15.5" class="t"/><circle cx="18" cy="18" r="15.5" class="p" id="adfRing"/></svg><b id="adfSec">${base}</b><span id="adfLbl">Récompense dans ${base} s</span></span><button class="adf-x" id="adfX" aria-label="Fermer l'annonce">✕</button></div></div>
    <div class="adf-done" id="adfDone" hidden></div>
    <div class="adf-bot"><div class="adf-card" id="adfCard">${ad.image_url?`<img src="${esc(ad.image_url)}" alt="">`:`<span class="adf-ico">📣</span>`}<div class="adf-ct"><b>${esc(ad.title)}</b>${ad.body?`<span>${esc(ad.body)}</span>`:""}</div>${ad.link_url?`<span class="adf-go">${esc(ad.cta||"Voir")}</span>`:""}</div>
      <div class="adf-bar"><i id="adfBar"></i></div></div>`;
  app.appendChild(el);hush&&hush();
  let need=base,el0=0,last=performance.now(),done=false,granted=false,closed=false,raf=0;const v=$("adfV");
  const snd=$("adfSnd");const setSnd=on=>{if(snd)snd.textContent=on?"🔊":"🔇";};
  // Son : la vidéo essaie avec le son (le joueur vient de toucher), sinon en muet ; l'image joue sa musique éventuelle.
  if(v){v.muted=!adSoundOn();AD.musicWas=!!S.set.music;if(typeof stopMusic==="function")stopMusic();
    v.addEventListener("loadedmetadata",()=>{if(!ad.duration_s&&isFinite(v.duration)&&v.duration>1)need=Math.min(120,Math.max(3,Math.floor(v.duration)));});
    v.addEventListener("ended",()=>{if(!done){try{v.currentTime=0;v.play();}catch(e){}}});
    const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;setSnd(false);v.play().catch(()=>{});});setSnd(!v.muted);
    v.addEventListener("volumechange",()=>setSnd(!v.muted));
    if(snd)snd.onclick=e=>{e.stopPropagation();v.muted=!v.muted;if(!v.muted)v.play().catch(()=>{});};}
  else if(ad.audio_url){const ok=adAudioPlay(ad.audio_url);setSnd(ok&&adSoundOn());
    if(snd)snd.onclick=e=>{e.stopPropagation();const a=AD.au;if(!a)return;if(!a.paused&&a.getAttribute("src")===ad.audio_url){a.pause();setSnd(false);}else{if(a.getAttribute("src")!==ad.audio_url){a.src=ad.audio_url;a.loop=true;a.volume=.85;}if(typeof stopMusic==="function")stopMusic();AD.musicWas=AD.musicWas||!!S.set.music;a.play().then(()=>setSnd(true),()=>{});}};}
  adLog(ad,"view","reward");
  setTimeout(()=>{const cd=$("adfCard");if(cd)cd.classList.add("on");},1200);
  const ring=$("adfRing"),C=2*Math.PI*15.5;if(ring){ring.style.strokeDasharray=C;ring.style.strokeDashoffset=0;}
  const finish=async(viaClick)=>{if(done)return;done=true;cancelAnimationFrame(raf);
    $("adfPill").classList.add("wait");$("adfLbl").textContent="Validation…";$("adfSec").textContent="";
    const claim=async()=>{const {data,error}=await sb.rpc("claim_ad_reward",{p_ad:ad.id,p_viewer:adViewer(),p_city:(S.loc&&S.loc.city)||""});if(error)throw error;return data||{};};
    let r;try{if(viaClick)await new Promise(z=>setTimeout(z,600));r=await claim();if(!r.ok&&r.reason==="too_soon"){await new Promise(z=>setTimeout(z,2500));r=await claim();}}catch(e){r={ok:false,reason:"error"};}
    if(closed)return;const pill=$("adfPill"),box=$("adfDone");pill.hidden=true;$("adfBar").style.width="100%";
    if(r.ok){granted=true;if(o.life){regen();S.hearts=Math.min(MAX_HEARTS,S.hearts+(+r.lives||0));if(S.hearts>=MAX_HEARTS)S.heartAt=0;}else{helpsReset();S.helps+=(+r.helps||0);}save();sfx("coin");
      box.innerHTML=`<span class="ok">✓</span><span><b>Récompense accordée : ${o.prize}</b><small>${typeof r.left==="number"&&r.left>0?`Encore ${r.left} annonce${r.left>1?"s":""} récompensée${r.left>1?"s":""} aujourd'hui`:"Merci d'avoir regardé l'annonce"}</small></span>`;}
    else if(r.reason==="already"){granted=true;box.innerHTML=`<span class="ok">✓</span><span><b>Récompense déjà accordée</b></span>`;}
    else box.innerHTML=`<span class="ok bad">!</span><span><b>${r.reason==="limit"?"Limite du jour atteinte":"Récompense non validée"}</b><small>${r.reason==="limit"?o.later:"Vérifie ta connexion et réessaie."}</small></span>`;
    box.hidden=false;requestAnimationFrame(()=>box.classList.add("on"));$("adfX").classList.add("ready");};
  // Minuteur : avance seulement quand l'annonce est réellement à l'écran (et que la vidéo joue).
  const step=t=>{if(closed||done)return;const dt=Math.min(250,t-last);last=t;
    const running=document.visibilityState==="visible"&&(!v||(!v.paused&&v.readyState>=3));if(running)el0+=dt;
    const rem=Math.max(0,need-el0/1000),k=Math.min(1,el0/1000/need);$("adfBar").style.width=(k*100)+"%";if(ring)ring.style.strokeDashoffset=C*k;
    const s=Math.ceil(rem);$("adfSec").textContent=s;$("adfLbl").textContent=`Récompense dans ${s} s`;
    if(rem<=0){finish(false);return;}raf=requestAnimationFrame(step);};raf=requestAnimationFrame(step);
  const close=()=>{closed=true;cancelAnimationFrame(raf);if(v){try{v.pause();v.removeAttribute("src");v.load();}catch(e){}}adAudioStop();if(v&&AD.musicWas&&S.set.music&&typeof startMusic==="function")startMusic();AD.musicWas=false;
    el.classList.add("out");setTimeout(()=>el.remove(),250);if(curScreen==="path")renderTop();if(curScreen==="profile")renderProfile();if(granted&&o.after)o.after();};
  $("adfX").onclick=e=>{e.stopPropagation();if(done){close();return;}
    if(v)v.pause();const cf=document.createElement("div");cf.className="adf-confirm";
    cf.innerHTML=`<div><b>Quitter l'annonce ?</b><p>Tu ne recevras pas ta récompense (${o.prize}).</p><button class="btn" id="adfKeep">Continuer l'annonce</button><button class="textlink" id="adfQuit" style="color:#fff">Quitter</button></div>`;el.appendChild(cf);
    $("adfKeep").onclick=()=>{cf.remove();last=performance.now();if(v)v.play().catch(()=>{});};$("adfQuit").onclick=()=>{cf.remove();close();};};
  const open=e=>{if(e)e.stopPropagation();if(!ad.link_url)return;adOpen(ad,"reward");if(!done)finish(true);};
  $("adfCard").onclick=open;const m=el.querySelector(".adf-media");if(m&&ad.link_url)m.onclick=open;}

/* ---------- Fenêtres « Mes vies » et « Mes aides » ---------- */
function statSheet(kind,after){sfx("tap");regen();helpsReset();const c=adCfg();const life=kind==="life";const un=unlimited();
  const gain=life?(+c.reward_lives||0):(+c.reward_helps||0);
  const draw=()=>{regen();helpsReset();const full=life&&(un||S.hearts>=MAX_HEARTS);
    const big=life?(un?"∞":`${S.hearts}<small>/${MAX_HEARTS}</small>`):`${S.helps}`;
    const sub=life?(un?`Vies illimitées encore ${fmt(unlimitedLeft())}`:S.hearts<MAX_HEARTS?`+1 ♥ dans <b id="stCd">${fmt(nextHeartIn())}</b> · un cœur revient toutes les 25 minutes`:"Tes vies sont au complet"):`Tu reçois ${DAILY_HELPS} aides chaque jour, à minuit. Une aide retire une mauvaise réponse pendant un niveau.`;
    openSheet(`<div class="center" style="padding-top:2px"><div class="stbig ${life?"hp":"hl"}"><span>${life?"♥":"💡"}</span><b>${big}</b></div><h2 style="font-size:24px;margin:6px 0 4px">${life?"Mes vies":"Mes aides"}</h2><p style="line-height:1.5;margin:0 0 14px">${sub}</p></div>
      <div style="display:grid;gap:10px">${gain>0?`<button class="btn warm" id="stAd"${full?" disabled":""}>▶️ Regarder une annonce · +${gain} ${life?"♥":`aide${gain>1?"s":""}`}</button>`:""}
      ${life?`<button class="btn ghost" id="stInv">📤 Inviter un ami · 24 h de vies illimitées</button>`:""}<button class="textlink" id="stClose">Fermer</button></div>
      ${life&&+c.online_min_lives>0?`<p class="muted" style="font-size:12.5px;text-align:center;margin:10px 0 0">Il faut au moins ${+c.online_min_lives} ♥ pour jouer en ligne ou entre amis.</p>`:""}`);
    const ad=$("stAd");if(ad)ad.onclick=()=>{closeSheet();adReward(kind,()=>{if(curScreen==="path")renderTop();if(after)after();});};
    const iv=$("stInv");if(iv)iv.onclick=()=>{closeSheet();if(typeof olShareInvite==="function")olShareInvite();};
    $("stClose").onclick=()=>{closeSheet();if(after)after();};};
  draw();clearInterval(AD.stT);AD.stT=setInterval(()=>{const e=$("stCd");if(!e||$("veil").hidden){clearInterval(AD.stT);return;}e.textContent=fmt(nextHeartIn());},1000);}

/* ---------- Jouer en ligne / entre amis : un minimum de vies ---------- */
function adGate(retry){const c=adCfg();const need=+c.online_min_lives||0;if(unlimited()||need<=0)return true;regen();if(S.hearts>=need)return true;
  openSheet(`<div class="center" style="padding-top:4px"><div class="medal big">⚔️</div><h2 style="font-size:24px">Il te faut ${need} ♥ pour jouer en ligne</h2><p style="line-height:1.5">Tu en as ${S.hearts}. Regarde une annonce pour gagner +${+c.reward_lives||1} ♥, ou attends le prochain cœur (${fmt(nextHeartIn())}).</p></div>
   <div style="display:grid;gap:10px"><button class="btn warm" id="gAd">▶️ Regarder une annonce · +${+c.reward_lives||1} ♥</button><button class="btn ghost" id="gNo">Plus tard</button></div>`);
  $("gAd").onclick=()=>adReward("life",()=>{regen();if(S.hearts>=need)retry();else adGate(retry);});$("gNo").onclick=closeSheet;return false;}
function adPayMatch(id){const c=adCfg();const cost=+c.online_cost_lives||0;if(!id||unlimited()||cost<=0||(S.olPaid&&S.olPaid[id]))return;
  S.olPaid=S.olPaid||{};S.olPaid[id]=Date.now();const ks=Object.keys(S.olPaid);if(ks.length>80)ks.sort((a,b)=>S.olPaid[a]-S.olPaid[b]).slice(0,ks.length-80).forEach(k=>{delete S.olPaid[k];});
  for(let i=0;i<cost;i++)loseHeart();}

setTimeout(()=>{adLoadSettings();adLocate();if(!S.adAt)S.adAt=S.activeSec;},2500);

</script>
